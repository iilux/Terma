<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Source de l'icône d'application Terma — la lettre T tracée sur la grille
    de caractères d'un terminal (5 × 5 cellules, façon police bitmap), en
    blanc sur un carré arrondi noir. Même dessin que le logo de la titlebar
    (TitleBar.jsx). Régénérer les PNG/ICO : npm run icons
  -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#0c0c0c" />
  <g fill="#fafafa">
    <!-- barre du T -->
    <rect x="100" y="100" width="56" height="56" />
    <rect x="164" y="100" width="56" height="56" />
    <rect x="228" y="100" width="56" height="56" />
    <rect x="292" y="100" width="56" height="56" />
    <rect x="356" y="100" width="56" height="56" />
    <!-- jambage -->
    <rect x="228" y="164" width="56" height="56" />
    <rect x="228" y="228" width="56" height="56" />
    <rect x="228" y="292" width="56" height="56" />
    <rect x="228" y="356" width="56" height="56" />
  </g>
</svg>
